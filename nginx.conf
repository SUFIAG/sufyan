server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    # Fly health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # CSS/JS: file names are not fingerprinted, so cache for a day and revalidate.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(png|svg|pdf|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # HTML: always revalidate so a deploy shows up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
